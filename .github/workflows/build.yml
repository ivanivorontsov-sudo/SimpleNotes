name: Build SimpleNotes EXE and Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name SimpleNotes main.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleNotes-exe
          path: dist/SimpleNotes.exe

      - name: Install Inno Setup
        run: |
          choco install innosetup -y

      - name: Compile Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload Installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleNotes-Setup
          path: Output/SimpleNotes-Setup.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SimpleNotes.exe
            Output/SimpleNotes-Setup.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
