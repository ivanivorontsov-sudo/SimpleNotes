name: Windows package smoke test

on:
  pull_request:

permissions:
  contents: read

jobs:
  windows-package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build standalone EXE
        run: pyinstaller --noconfirm --onefile --windowed --name SimpleNotes main.py

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Compile installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          if (!(Test-Path "dist\SimpleNotes.exe")) {
            throw "PyInstaller did not create dist\SimpleNotes.exe"
          }
          if (!(Test-Path "Output\SimpleNotes-Setup.exe")) {
            throw "Inno Setup did not create Output\SimpleNotes-Setup.exe"
          }
